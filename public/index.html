<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแทงออนไลน์ - POKDENG & HILO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- LINE LIFF SDK -->

    <style>
        .chip {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .chip-active {
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8);
            border-color: #facc15 !important;
        }
        .bet-zone {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s;
        }
        .bet-zone:active {
            opacity: 0.7;
        }

</head>
<body class="bg-gray-900 text-white min-h-screen pb-24">

    <!-- Header / โปรไฟล์สมาชิก -->
    <header class="bg-gray-800 p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-gray-700">
        <div>
            <div id="user-name" class="font-bold text-lg text-yellow-400">กำลังโหลดข้อมูล...</div>

        </div>

            <div class="text-xs text-gray-400">เครดิตคงเหลือ</div>

        <!-- แท็บสลับโหมด แทงป๊อกเด้ง / แทงไฮโล -->

            <button id="tab-hilo" onclick="switchTab('hilo')" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-400">🎲 ไฮโล</button>

        <!-- Section: กระดานป๊อกเด้ง -->

            <h3 class="font-bold text-yellow-400 border-b border-gray-700 pb-2 text-center">🎰 โต๊ะแทงป๊อกเด้ง</h3>
            
            <!-- ปุ่มสลับโหมด แทงผู้เล่น / แทงเจ้ามือ -->
            <div class="flex justify-center gap-2">
                <button id="btn-pok-player" onclick="setPokMode('player')" class="px-4 py-2 text-sm font-bold rounded-lg border-2 border-cyan-400 bg-cyan-900 text-cyan-200 shadow-md">แทงผู้เล่น</button>
                <button id="btn-pok-dealer" onclick="setPokMode('dealer')" class="px-4 py-2 text-sm font-bold rounded-md border border-gray-600 bg-gray-700 text-gray-400">แทงเจ้ามือ</button>

            <!-- ตองรวม / ตองระบุ -->
            <div class="flex gap-1">

                        <button onclick="placeBet('hilo', 'ตอง2')" class="bg-gray-800 p-1 rounded font-bold hover:bg-purple-900 relative">2<span id="hilo-chip-ตอง2" class="hidden absolute -top-1 -right-1 px-1 bg-yellow-500 text-black text-[9px] rounded-full"></span></button>
                        <button onclick="placeBet('hilo', 'ตอง3')" class="bg-gray-800 p-1 rounded font-bold hover:bg-purple-900 relative">3<span id="hilo-chip-ตอง3" class="hidden absolute -top-1 -right-1 px-1 bg-yellow-500 text-black text-[9px] rounded-full"></span></button>
                        <button onclick="placeBet('hilo', 'ตอง4')" class="bg-gray-800 p-1 rounded font-bold hover:bg-purple-900 relative">4<span id="hilo-chip-ตอง4" class="hidden absolute -top-1 -right-1 px-1 bg-yellow-500 text-black text-[9px] rounded-full"></span></button>
                        <button onclick="placeBet('hilo', 'ตอง5')" class="bg-gray-800 p-1 rounded font-bold hover:bg-purple-900 relative">5<span id="hilo-chip-ตอง5" class="hidden absolute -top-1 -right-1 px-1 bg-yellow-500 text-black text-[9px] rounded-full"></span></button>
                        <button onclick="placeBet('hilo', 'ตอง6')" class="bg-gray-800 p-1 rounded font-bold hover:bg-purple-900 relative">6<span id="hilo-chip-ตอง6" class="hidden absolute -top-1 -right-1 px-1 bg-yellow-500 text-black text-[9px] rounded-full"></span></button>

            </div>

            <!-- สูง / ต่ำ & โต๊ดหลัก -->
            <div class="grid grid-cols-5 gap-1">
                <div onclick="placeBet('hilo', 'ต่ำ')" class="bet-zone bg-gray-700 border border-purple-500/50 rounded p-2 flex flex-col items-center justify-between min-h-[60px]">
                    <span class="font-bold text-red-400">ต่ำ</span>

                </div>
                <div onclick="placeBet('hilo', '123')" class="bet-zone bg-gray-700 border border-purple-500/50 rounded p-1 text-center flex flex-col justify-between">

                </div>
                <div onclick="placeBet('hilo', '11ไฮโล')" class="bet-zone bg-gray-700 border border-purple-500/50 rounded p-1 text-center flex flex-col justify-between">
                    <span class="font-bold text-yellow-300">11ไฮโล</span>
                    <span id="hilo-chip-11ไฮโล" class="hidden px-1 bg-yellow-500 text-black rounded-full">0</span>
                </div>
                <div onclick="placeBet('hilo', '456')" class="bet-zone bg-gray-700 border border-purple-500/50 rounded p-1 text-center flex flex-col justify-between">

                </div>
            </div>

            <!-- เลขเต็ง 1-6 -->
            <div class="grid grid-cols-6 gap-1">
                <script>
                    for(let i=1; i<=6; i++){
                        document.write(`
                            <div onclick="placeBet('hilo', '${i}')" class="bet-zone bg-gray-700 border border-purple-500/50 rounded p-2 text-center">
                                <div class="font-bold text-purple-300">${i}</div>
                                <span id="hilo-chip-${i}" class="hidden px-1 bg-yellow-500 text-black text-[10px] rounded-full">0</span>

                        `);

            </div>
        </div>

        <!-- ยอดรวมเตรียมส่งโพย + ปุ่ม ยืนยัน / ยกเลิก -->
        <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 space-y-3">
            <div class="flex justify-between items-center text-sm px-2">
                <span class="text-gray-400">ยอดเงินลงโพยรอบนี้:</span>
                <span id="total-pending-amount" class="text-xl font-bold text-yellow-400">0 ฿</span>
            </div>
            <div class="flex gap-2">
                <button onclick="clearPendingBets()" class="flex-1 py-2.5 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-lg shadow">
                    ❌ ยกเลิก
                </button>
                <button onclick="submitBoardBets()" class="flex-2 w-2/3 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 text-gray-900 font-bold rounded-lg shadow hover:brightness-110">
                    ✅ ยืนยันส่งโพย
                </button>
            </div>
        </div>

        <!-- Selector ชิปเลือกราคา (ตรึงอยู่ด้านล่าง) -->

            <div class="max-w-md mx-auto flex justify-between items-center gap-1 overflow-x-auto px-1">
                <script>
                    const chips = [1, 5, 10, 25, 50, 100, 500];
                    chips.forEach((val, idx) => {
                        const active = idx === 2 ? 'chip-active' : '';
                        document.write(`
                            <button id="chip-btn-${val}" onclick="selectChip(${val})" class="chip ${active} flex-shrink-0 w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-yellow-500 bg-gray-900 text-yellow-400 font-bold text-xs sm:text-sm flex items-center justify-center shadow-lg">

        <!-- รายการโพยที่บันทึกแล้ว -->
<div class="bg-gray-800 p-4 rounded-lg border border-gray-700 space-y-2">
    <h4 class="font-bold text-sm text-gray-300 border-b border-gray-700 pb-1">📋 โพยของคุณในรอบนี้</h4>
    <div id="myBetsContainer" class="text-xs text-gray-400 space-y-1">
        ยังไม่มีรายการแทง
    </div>
</div>

    </main>

<script>
    // 1. Firebase Config
    const firebaseConfig = {
        databaseURL: "https://my-pokdeng-bot-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUserId = null;
    let currentUserData = null;
    let isRoundOpen = false;
    let currentRound = 0;

    let activeTab = 'pok'; // 'pok' หรือ 'hilo'
    let pokMode = 'player'; // 'player' หรือ 'dealer'
    let selectedChipValue = 10;
    let pendingBets = {}; 
    let localPokBets = {};
    let localHiloBets = {};

    // 2. เริ่มต้น LIFF
    async function initLIFF() {
        try {
            await liff.init({ liffId: "2011387264-7B981j5N" });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                currentUserId = profile.userId;
            } else {
                liff.login();
            }
        } catch (err) {
            console.error("LIFF Init Error:", err);
            currentUserId = "U2fb9233e5c539ae3970cbd698e2e18db";
        }
        listenToUserData();
        listenToSystemState();
    }

    // ฟังสถานะรอบเปิด/ปิด Real-time
    function listenToSystemState() {
        db.ref('system_data').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            isRoundOpen = !!data.isRoundOpen;
            currentRound = data.currentRound || 0;

            const statusEl = document.getElementById('round-status');
            const roundTextEl = document.getElementById('current-round-text');

            if (roundTextEl) roundTextEl.innerText = `รอบที่: ${currentRound}`;
            if (statusEl) {
                if (isRoundOpen) {
                    statusEl.innerText = '🟢 เปิดรับแทง';
                    statusEl.className = 'text-lg font-bold text-green-400';
                } else {
                    statusEl.innerText = '🚫 ปิดรับแทง';
                    statusEl.className = 'text-lg font-bold text-red-500';
                }
            }
        });
    }

  // 3. ฟังข้อมูล Real-time และเก็บลงตัวแปร Local (Instant Sync)
function listenToUserData() {
    if (!currentUserId) return;

    // 1. ฟังยอดเงิน/ชื่อผู้ใช้
    db.ref(`system_data/usersWallets/${currentUserId}`).on('value', (snapshot) => {
        const userData = snapshot.val();
        if (userData) {
            document.getElementById('user-name').innerText = userData.nickname || userData.name || "สมาชิก";
            document.getElementById('user-id').innerText = `ID: ${userData.memberNumber || '-'}`;
            document.getElementById('user-balance').innerText = `${(userData.balance || 0).toLocaleString()} ฿`;
        }
    });

    // 2. 🌟 [วางโค้ดฟังโพย Real-time ตรงจุดนี้]
    const dbRef = db.ref(`system_data/roundBets/${currentUserId}`);

    dbRef.on('value', (snapshot) => {
        const betsData = snapshot.val();
        const betsContainer = document.getElementById('myBetsContainer'); // Element แสดงโพยหน้าเว็บ
        
        if (!betsData || Object.keys(betsData).length === 0) {
            betsContainer.innerHTML = `<div class="text-gray-400 text-sm">ยังไม่มีรายการแทงในรอบนี้</div>`;
            return;
        }

        let html = '';
        let totalHold = 0;

        // แปลงเป็น Array เพื่อรองรับข้อมูลทั้งแบบ Array และ Object
        const betsList = Array.isArray(betsData) ? betsData : Object.values(betsData);

        betsList.forEach((bet, index) => {
            if (!bet) return;
            totalHold += (bet.holdCost || 0);
            html += `
                <div class="flex justify-between items-center py-1 border-b border-gray-800 text-xs text-gray-200">
                    <span>${index + 1}. ♠️ ${bet.detail}</span>
                    <span class="text-yellow-400 font-bold">${(bet.actualBet || 0).toLocaleString()} B</span>
                </div>
            `;
        });

        if (totalHold > 0) {
            html += `
                <div class="mt-2 text-xs text-amber-500 font-bold">
                    🔒 ล็อกค้ำประกันรวม: ${totalHold.toLocaleString()} บาท
                </div>
            `;
        }
        // 🌟 เพิ่มปุ่มคืนโพยตรงนี้
    html += `
        <button onclick="cancelMyBets()" class="w-full mt-3 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg shadow border border-red-500 flex items-center justify-center gap-1">
            🗑️ คืนโพยทั้งหมดในรอบนี้
        </button>
    `;

        betsContainer.innerHTML = html;
    });
}
    
    // ฟังก์ชันกดคืนโพยจากหน้าเว็บ
async function cancelMyBets() {
    if (!isRoundOpen) return alert('⚠️ ขณะนี้ปิดรับแทงแล้ว ไม่สามารถยกเลิกโพยได้ครับ');
    if (!confirm('❓ คุณต้องการคืนโพยทั้งหมดในรอบนี้ใช่หรือไม่?')) return;

    try {
        // ยิงคำสั่ง "r" เข้า Endpoint ตัวเดิมที่ใช้สั่งแทง
        const res = await fetch('/api/web-bet-trigger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUserId,
                betText: "r" // 👈 ส่งคำสั่ง r ไปให้บอทหลักประมวลผลคืนโพย
            })
        });

        const result = await res.json();

        if (result.success) {
            alert('✅ คืนโพยสำเร็จ!');
        } else {
            alert(`⚠️ คืนโพยไม่สำเร็จ: ${result.message || 'เกิดข้อผิดพลาด'}`);
        }
    } catch (err) {
        console.error(err);
        alert('❌ เกิดข้อผิดพลาดในการส่งคำขอคืนโพย');
    }
}
    function selectChip(value) {
        selectedChipValue = value;
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('chip-active'));
        document.getElementById(`chip-btn-${value}`).classList.add('chip-active');
    }

    function setPokMode(mode) {
        pokMode = mode;
        const btnPlayer = document.getElementById('btn-pok-player');
        const btnDealer = document.getElementById('btn-pok-dealer');

        if (mode === 'player') {
            btnPlayer.className = "px-4 py-2 text-sm font-bold rounded-lg border-2 border-cyan-400 bg-cyan-900 text-cyan-200 shadow-md";
            btnDealer.className = "px-4 py-2 text-sm font-bold rounded-md border border-gray-600 bg-gray-700 text-gray-400";
        } else {
            btnDealer.className = "px-4 py-2 text-sm font-bold rounded-lg border-2 border-amber-400 bg-amber-900 text-amber-200 shadow-md";
            btnPlayer.className = "px-4 py-2 text-sm font-bold rounded-md border border-gray-600 bg-gray-700 text-gray-400";
        }

        for (let i = 1; i <= 6; i++) {
            const label = document.getElementById(`pok-label-${i}`);
            if (label) {
                label.innerText = mode === 'player' ? `ขาที่ ${i}` : `เจ้าสู้ขา ${i}`;
                label.className = mode === 'player' ? 'font-bold text-cyan-300 text-sm' : 'font-bold text-amber-300 text-sm';
            }
        }
        clearPendingBets();
    }

    function placeBet(game, key) {
        if (!isRoundOpen) return alert('⚠️ ขณะนี้ปิดรับแทงอยู่ครับ');

        let betKey = key;
        if (game === 'pok') {
            betKey = pokMode === 'player' ? key : `เจ้าสู้ขา${key}`;
        }

        const currentAmount = pendingBets[betKey] || 0;
        pendingBets[betKey] = currentAmount + selectedChipValue;
        updateBoardUI();
    }

    function updateBoardUI() {
        let total = 0;
        document.querySelectorAll('[id^="pok-chip-"], [id^="hilo-chip-"]').forEach(el => {
            el.innerText = '0';
            el.classList.add('hidden');
        });

        for (const [key, amount] of Object.entries(pendingBets)) {
            total += amount;
            let elementId = '';
            if (activeTab === 'pok') {
                const rawKey = key.replace('เจ้าสู้ขา', '');
                elementId = `pok-chip-${rawKey}`;
            } else {
                elementId = `hilo-chip-${key}`;
            }

            const chipEl = document.getElementById(elementId);
            if (chipEl) {
                chipEl.innerText = `${amount}฿`;
                chipEl.classList.remove('hidden');
            }
        }
        document.getElementById('total-pending-amount').innerText = `${total.toLocaleString()} ฿`;
    }

    function clearPendingBets() {
        pendingBets = {};
        updateBoardUI();
    }

   // ยืนยันการส่งโพย (ปรับปรุงใหม่: ส่งข้อความรูปแบบไลน์ไปให้บอทหลักประมวลผล)
async function submitBoardBets() {
    if (!isRoundOpen) return alert('⚠️ ขณะนี้ปิดรับแทงอยู่ครับ');
    
    const entries = Object.entries(pendingBets);
    if (entries.length === 0) return alert('⚠️ กรุณาเลือกวางชิปบนกระดานก่อนครับ');

    try {
        for (const [key, amount] of entries) {
            let betText = "";

            // 1. แปลงรูปแบบการแทงป๊อกเด้งให้เป็นข้อความสไตล์ไลน์
            if (activeTab === 'pok') {
                if (key.startsWith('เจ้าสู้ขา')) {
                    const legNum = key.replace('เจ้าสู้ขา', '').trim();
                    betText = `จ${legNum}-${amount}`; // ได้เป็น "จ1-100"
                } else {
                    const legNum = key.replace('ขาที่', '').trim();
                    betText = `${legNum}-${amount}`;  // ได้เป็น "1-100"
                }
            } 
            // 2. แปลงรูปแบบการแทงไฮโลให้เป็นข้อความสไตล์ไลน์
            else if (activeTab === 'hilo') {
                betText = `${key} ${amount}`;         // ได้เป็น "สูง 100", "11ไฮโล 100", "1 100"
            }

            // 3. ยิงส่งข้อมูลไปหา Endpoint ใหม่ของบอทหลัก (Render)
            const res = await fetch('/api/web-bet-trigger', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    betText: betText
                })
            });
            
            const result = await res.json();
            
            // หากบอทหลักตีกลับว่าแทงไม่ได้ (เช่น ไม่ถึงขั้นต่ำ/เกินสูงสุด/เครดิตไม่พอ)
            if (!result.success) {
                alert(`⚠️ รายการ [${betText}] ไม่สำเร็จ: ${result.message}`);
                return;
            }
        }

        alert('✅ ส่งโพยสำเร็จ!');
        clearPendingBets();
    } catch (err) {
        console.error(err);
        alert('⚠️ เกิดข้อผิดพลาดในการส่งข้อมูลไปยังบอทหลัก');
    }
}
    // สลับแท็บ ป๊อกเด้ง / ไฮโล
    function switchTab(tab) {
        activeTab = tab;
        clearPendingBets();
        if (tab === 'pok') {
            document.getElementById('section-pok').classList.remove('hidden');
            document.getElementById('section-hilo').classList.add('hidden');
            document.getElementById('tab-pok').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-gray-900';
            document.getElementById('tab-hilo').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400';
        } else {
            document.getElementById('section-hilo').classList.remove('hidden');
            document.getElementById('section-pok').classList.add('hidden');
            document.getElementById('tab-hilo').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-purple-600 text-white';
            document.getElementById('tab-pok').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400'; // แก้ไข id ตรงนี้ให้ถูกต้อง
        }
    }

    window.onload = initLIFF;
</script>
