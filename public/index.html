<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแทงออนไลน์ - POKDENG & HILO</title>
    <!-- Tailwind CSS สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v8) สำหรับ Real-time Sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-10">

    <!-- Header / โปรไฟล์สมาชิก -->
    <header class="bg-gray-800 p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-gray-700">
        <div>
            <div id="user-name" class="font-bold text-lg text-yellow-400">กำลังโหลดข้อมูล...</div>
            <div id="user-id" class="text-xs text-gray-400">ID: -</div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400">เครดิตคงเหลือ</div>
            <div id="user-balance" class="font-bold text-xl text-green-400">0 ฿</div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- แถบสถานะรอบ -->
        <div id="status-card" class="bg-gray-800 p-3 rounded-lg border border-gray-700 text-center">
            <div class="text-xs text-gray-400">สถานะห้องปัจจุบัน</div>
            <div id="round-status" class="text-lg font-bold text-red-500">🚫 ปิดรับแทง</div>
            <div id="current-round-text" class="text-xs text-yellow-300 mt-1">รอบที่: 0</div>
        </div>

        <!-- แท็บสลับโหมด แทงป๊อกเด้ง / แทงไฮโล -->
        <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
            <button id="tab-pok" onclick="switchTab('pok')" class="flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-gray-900">🎴 ป๊อกเด้ง</button>
            <button id="tab-hilo" onclick="switchTab('hilo')" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-400">🎲 ไฮโล</button>
        </div>

        <!-- ฟอร์มแทงป๊อกเด้ง -->
        <div id="section-pok" class="bg-gray-800 p-4 rounded-lg border border-gray-700 space-y-3">
            <h3 class="font-bold text-yellow-400 border-b border-gray-700 pb-2">🎰 แทงป๊อกเด้ง</h3>
            <div>
                <label class="text-xs text-gray-300 block mb-1">เลือกขาที่ต้องการแทง (เช่น 1, 12, 123):</label>
                <input type="text" id="pok-legs" placeholder="เช่น 1 หรือ 12" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-center text-lg font-bold text-yellow-300 focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="text-xs text-gray-300 block mb-1">จำนวนเงินต่อขา (บาท):</label>
                <input type="number" id="pok-price" placeholder="100" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-center text-lg font-bold text-green-400 focus:outline-none focus:border-green-500">
            </div>
            <button onclick="submitPokBet()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 text-gray-900 font-bold rounded-lg shadow-md hover:brightness-110 transition">
                🚀 ส่งโพยป๊อกเด้ง
            </button>
        </div>

        <!-- ฟอร์มแทงไฮโล -->
        <div id="section-hilo" class="bg-gray-800 p-4 rounded-lg border border-gray-700 space-y-3 hidden">
            <h3 class="font-bold text-purple-400 border-b border-gray-700 pb-2">🎲 แทงไฮโล</h3>
            <div>
                <label class="text-xs text-gray-300 block mb-1">รูปแบบการแทง (สูง / ต่ำ / เต็ง 1-6 / โต๊ด 12):</label>
                <input type="text" id="hilo-type" placeholder="เช่น สูง, ต่ำ, 5, 23" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-center text-lg font-bold text-purple-300 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="text-xs text-gray-300 block mb-1">จำนวนเงิน (บาท):</label>
                <input type="number" id="hilo-price" placeholder="100" class="w-full p-2 bg-gray-700 rounded border border-gray-600 text-center text-lg font-bold text-green-400 focus:outline-none focus:border-green-500">
            </div>
            <button onclick="submitHiloBet()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-lg shadow-md hover:brightness-110 transition">
                🎲 ส่งโพยไฮโล
            </button>
        </div>

        <!-- รายการโพยที่แทงไปแล้วในรอบนี้ -->
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 space-y-2">
            <h4 class="font-bold text-sm text-gray-300 border-b border-gray-700 pb-1">📋 โพยของคุณในรอบนี้</h4>
            <div id="my-bets-list" class="text-xs text-gray-400 space-y-1">
                ยังไม่มีรายการแทง
            </div>
        </div>

    </main>

    <script>
        // 1. คอนฟิก Firebase (ดึงจาก Firebase URL เดียวกับใน Node.js)
        const firebaseConfig = {
            databaseURL: "https://my-pokdeng-bot-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUserId = null;
        let currentUserData = null;
        let isRoundOpen = false;
        let currentRound = 0;

        // 2. เริ่มต้นเชื่อมต่อ LIFF
        async function initLIFF() {
            try {
                // เปลี่ยน YOUR_LIFF_ID เป็น LIFF ID จาก LINE Developer Console ของน้า
                await liff.init({ liffId: "2011387264-7B981j5N" });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUserId = profile.userId;
                    listenToUserData();
                    listenToSystemState();
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Init Error:", err);
                // สำหรับทดสอบบนคอมพิวเตอร์ (จำลอง UserId)
                currentUserId = "U2fb9233e5c539ae3970cbd698e2e18db"; 
                listenToUserData();
                listenToSystemState();
            }
        }

        // 3. ฟังการเปลี่ยนแปลงข้อมูลยูสเซอร์จาก Firebase แบบ Real-time
        function listenToUserData() {
            db.ref(`system_data/usersWallets/${currentUserId}`).on('value', (snapshot) => {
                currentUserData = snapshot.val();
                if (currentUserData) {
                    document.getElementById('user-name').innerText = currentUserData.nickname || currentUserData.name || "สมาชิก";
                    document.getElementById('user-id').innerText = `ID: ${currentUserData.memberNumber || '-'}`;
                    document.getElementById('user-balance').innerText = `${(currentUserData.balance || 0).toLocaleString()} ฿`;
                }
            });

            // ดึงรายการแทงของตัวเองในรอบปัจจุบัน
            db.ref(`system_data`).on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const pokBets = (data.roundBets && data.roundBets[currentUserId]) ? data.roundBets[currentUserId] : [];
                const hiloBets = (data.hiloRoundBets && data.hiloRoundBets[currentUserId]) ? data.hiloRoundBets[currentUserId] : [];

                let html = '';
                pokBets.forEach(b => {
                    html += `<div class="flex justify-between bg-gray-700 p-2 rounded"><span>🎴 ป๊อกเด้ง: ขา ${b.betType}</span><span class="text-yellow-400 font-bold">${b.actualBet} ฿</span></div>`;
                });
                hiloBets.forEach(hb => {
                    const price = hb.totalPrice || hb.actualBet || hb.price || 0;
                    html += `<div class="flex justify-between bg-gray-700 p-2 rounded"><span>🎲 ไฮโล: ${hb.category || hb.type}</span><span class="text-purple-400 font-bold">${price} ฿</span></div>`;
                });

                document.getElementById('my-bets-list').innerHTML = html || 'ยังไม่มีรายการแทงในรอบนี้';
            });
        }

        // 4. ฟังสถานะการเปิด/ปิดรอบ Real-time
        function listenToSystemState() {
            db.ref('system_data').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                isRoundOpen = data.isRoundOpen || false;
                currentRound = data.currentRound || 0;

                const statusEl = document.getElementById('round-status');
                document.getElementById('current-round-text').innerText = `รอบที่: ${currentRound}`;

                if (isRoundOpen) {
                    statusEl.innerText = '🟢 เปิดรับแทง';
                    statusEl.className = 'text-lg font-bold text-green-400 animate-pulse';
                } else {
                    statusEl.innerText = '🚫 ปิดรับแทง';
                    statusEl.className = 'text-lg font-bold text-red-500';
                }
            });
        }

        // 5. ฟังก์ชันส่งโพยป๊อกเด้ง (บันทึกตรงลง Firebase ลิ้งค์กับกลุ่มทันที)
       async function submitPokBet() {
    if (!isRoundOpen) return alert('⚠️ ขณะนี้ปิดรับแทงอยู่ครับ');
    const legs = document.getElementById('pok-legs').value.trim();
    const price = parseFloat(document.getElementById('pok-price').value);

    if (!legs || isNaN(price) || price <= 0) return alert('⚠️ กรุณากรอกข้อมูลขาและจำนวนเงินให้ถูกต้อง');

    try {
        // ยิง request ไปที่ API /api/place-bet ใน server.js
        const res = await fetch('/api/place-bet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUserId,
                amount: price,
                type: legs
            })
        });

        const result = await res.json();
        if (result.success) {
            alert('✅ ส่งโพยป๊อกเด้งสำเร็จ!');
            document.getElementById('pok-legs').value = '';
            document.getElementById('pok-price').value = '';
        } else {
            alert('⚠️ ไม่สามารถส่งโพยได้: ' + result.message);
        }
    } catch (err) {
        console.error(err);
        alert('⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
    }
}

        // 6. ฟังก์ชันส่งโพยไฮโล
        async function submitHiloBet() {
    if (!isRoundOpen) return alert('⚠️ ขณะนี้ปิดรับแทงอยู่ครับ');
    const type = document.getElementById('hilo-type').value.trim();
    const price = parseFloat(document.getElementById('hilo-price').value);

    if (!type || isNaN(price) || price <= 0) return alert('⚠️ กรุณากรอกรูปแบบและจำนวนเงิน');

    try {
        const res = await fetch('/api/place-bet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUserId,
                amount: price,
                type: type
            })
        });

        const result = await res.json();
        if (result.success) {
            alert('✅ ส่งโพยไฮโลสำเร็จ!');
            document.getElementById('hilo-type').value = '';
            document.getElementById('hilo-price').value = '';
        } else {
            alert('⚠️ ไม่สามารถส่งโพยได้: ' + result.message);
        }
    } catch (err) {
        console.error(err);
        alert('⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
    }
}

        // สลับแท็บ UI
        function switchTab(tab) {
            if (tab === 'pok') {
                document.getElementById('section-pok').classList.remove('hidden');
                document.getElementById('section-hilo').classList.add('hidden');
                document.getElementById('tab-pok').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-gray-900';
                document.getElementById('tab-hilo').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400';
            } else {
                document.getElementById('section-hilo').classList.remove('hidden');
                document.getElementById('section-pok').classList.add('hidden');
                document.getElementById('tab-hilo').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-purple-600 text-white';
                document.getElementById('tab-pok').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400';
            }
        }

        window.onload = initLIFF;
    </script>
</body>
</html>
