<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบถอนเงินออโต้</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .header-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* กล่องยอดเงินพรีเมียม */
        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .balance-label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 300;
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 600;
            color: #fbbf24;
            letter-spacing: 0.5px;
        }

        .currency-unit {
            font-size: 16px;
            color: #cbd5e1;
            font-weight: 400;
            margin-left: 4px;
        }

        /* ข้อมูลบัญชีผู้รับเงิน */
        .account-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .account-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .account-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .account-detail:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #64748b;
        }

        .detail-value {
            font-weight: 500;
            color: #0f172a;
        }

        /* ฟิลด์กรอกข้อมูล */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-amount {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-amount:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* ปุ่มกดดีไซน์ใหม่ */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-admin {
            background-color: #06C755;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            border-radius: 12px;
            padding: 13px;
            font-weight: 500;
            font-size: 15px;
            transition: background 0.2s ease;
        }

        .btn-admin:hover {
            background-color: #05b34c;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        /* Pop-up Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 32px 24px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 330px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: popIn 0.3s ease-out;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header-title">
        <span>💎</span> ระบบถอนเงินออโต้
    </div>

    <!-- บัตรแสดงยอดเงิน -->
    <div class="balance-card">
        <div class="balance-label">ยอดเงินที่ถอนได้คงเหลือ</div>
        <div>
            <span id="userBalance" class="balance-value">0.00</span>
            <span class="currency-unit">บาท</span>
        </div>
    </div>

    <!-- บัญชีผู้รับเงิน -->
    <div class="account-card">
        <div class="account-card-title">
            <span>🏦</span> บัญชีรับเงินของคุณ
        </div>
        <div class="account-detail">
            <span class="detail-label">ธนาคาร:</span>
            <span id="userBank" class="detail-value">กำลังโหลด...</span>
        </div>
        <div class="account-detail">
            <span class="detail-label">เลขที่บัญชี:</span>
            <span id="userAcc" class="detail-value">กำลังโหลด...</span>
        </div>
        <div class="account-detail">
            <span class="detail-label">ชื่อบัญชี:</span>
            <span id="userName" class="detail-value">กำลังโหลด...</span>
        </div>
    </div>

    <form id="withdrawForm">
        <div class="form-group">
            <label for="withdrawAmount" class="form-label">ระบุจำนวนเงินที่ต้องการถอน</label>
            <div class="input-wrapper">
                <input type="number" id="withdrawAmount" class="input-amount" placeholder="ขั้นต่ำ 100 บาท" min="100" required>
            </div>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-submit">ยืนยันการแจ้งถอนเงิน</button>
    </form>

    <a href="https://lin.ee/QwOZ9Cf" target="_blank" class="btn-admin">💬 ติดต่อแอดมิน</a>
    <div id="statusMessage"></div>
</div>

<!-- ⏳ Pop-up Loading -->
<div id="loadingModal" class="modal">
    <div class="modal-content">
        <div class="spinner"></div>
        <h3 style="margin-top: 20px; margin-bottom: 8px; color: #0f172a;">กำลังทำรายการถอน...</h3>
        <p style="color: #64748b; font-size: 14px; margin: 0;">กรุณารอสักครู่ ระบบกำลังประมวลผล</p>
    </div>
</div>

<!-- 🎉 Pop-up สำเร็จ -->
<div id="successModal" class="modal">
    <div class="modal-content">
        <div style="font-size: 54px; color: #22c55e; margin-bottom: 8px;">✅</div>
        <h3 style="margin: 0 0 8px 0; color: #0f172a;">ส่งคำขอถอนเงินสำเร็จ!</h3>
        <p id="modalMessage" style="color: #64748b; margin: 0 0 20px 0; font-size: 14px; line-height: 1.5;"></p>
        <button onclick="window.location.reload()" class="btn-submit" style="background: #0f172a; padding: 12px;">ตกลง</button>
    </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    let userId = "";
    let currentBalance = 0;

    async function initLiff() {
        try {
            await liff.init({ liffId: "2011466617-EdngTg1w" });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userId = profile.userId;
                getUserData(userId);
            } else {
                liff.login();
            }
        } catch (err) {
            console.error("LIFF Error:", err);
            const urlParams = new URLSearchParams(window.location.search);
            userId = urlParams.get('userId');
            if (userId) getUserData(userId);
        }
    }
    initLiff();

    async function getUserData(uid) {
        try {
            const res = await fetch(`/api/user-profile?userId=${uid}`);
            const data = await res.json();
            if (data.success) {
                currentBalance = data.balance || 0;
                document.getElementById('userBalance').innerText = currentBalance.toLocaleString('th-TH', {minimumFractionDigits: 2});
                document.getElementById('userBank').innerText = data.bankName || 'ไม่ระบุ';
                document.getElementById('userAcc').innerText = data.bankAccount || 'ไม่ระบุ';
                document.getElementById('userName').innerText = data.name || 'ไม่ระบุ';
            }
        } catch (e) {
            console.error('Fetch user data failed', e);
        }
    }

    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!userId) {
            alert('ไม่พบข้อมูลสมาชิก กรุณาเข้าผ่าน LINE อีกครั้ง');
            return;
        }

        const amount = parseFloat(document.getElementById('withdrawAmount').value);

        if (amount > currentBalance) {
            alert('❌ ยอดเงินของคุณไม่พอสำหรับการถอน');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');
        const loadingModal = document.getElementById('loadingModal');

        submitBtn.disabled = true;
        loadingModal.style.display = 'flex';
        statusMsg.innerText = '';

        try {
            const response = await fetch('/api/withdraw/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount })
            });

            const result = await response.json();
            loadingModal.style.display = 'none';

            if (result.success) {
                document.getElementById('modalMessage').innerText = `ระบบได้รับคำขอถอนเงินจำนวน ${amount.toLocaleString('th-TH')} บาท เรียบร้อยแล้ว\nเงินจะเข้าบัญชีภายใน 1-3 นาทีครับ`;
                document.getElementById('successModal').style.display = 'flex';
            } else {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = `❌ ${result.message}`;
            }
        } catch (err) {
            loadingModal.style.display = 'none';
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
